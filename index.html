<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-visual">
<title>Kana Dojo</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: 2rem;
  }

  .app {
    width: 100%;
    max-width: 520px;
    padding: 1rem 1.5rem 2rem;
    text-align: center;
  }

  h1 {
    font-size: 1.6rem;
    font-weight: 700;
    margin-bottom: 1rem;
    color: #f0f0f0;
    letter-spacing: 0.02em;
  }

  /* --- Kana set toggle --- */
  .modes {
    display: flex;
    gap: 0.5rem;
    justify-content: center;
    margin-bottom: 0.6rem;
  }

  .modes button, .view-toggle button {
    padding: 0.4rem 0.9rem;
    border: 2px solid #3a3a5c;
    border-radius: 6px;
    background: transparent;
    color: #b0b0c8;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.15s;
  }

  .modes button:hover, .view-toggle button:hover { border-color: #6c63ff; color: #d0d0e8; }
  .modes button.active { background: #6c63ff; border-color: #6c63ff; color: #fff; }

  /* --- Include checkboxes --- */
  .includes {
    display: flex;
    gap: 1.2rem;
    justify-content: center;
    margin-bottom: 0.6rem;
  }

  .includes label {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.8rem;
    color: #8888aa;
    cursor: pointer;
    user-select: none;
  }

  .includes input[type="checkbox"] {
    accent-color: #6c63ff;
    width: 15px;
    height: 15px;
    cursor: pointer;
  }

  /* --- View toggle (Drill / Study) --- */
  .view-toggle {
    display: flex;
    gap: 0.5rem;
    justify-content: center;
    margin-bottom: 1.5rem;
  }

  .view-toggle button.active { background: #4ecca3; border-color: #4ecca3; color: #111; }

  /* ====== DRILL VIEW ====== */
  .drill-view { display: block; }
  .drill-view.hidden, .study-view.hidden, .lesson-view.hidden { display: none; }

  .card {
    background: #16213e;
    border-radius: 16px;
    padding: 2rem 1rem 1.8rem;
    margin-bottom: 1.2rem;
    position: relative;
    transition: box-shadow 0.3s;
  }

  .card.correct { box-shadow: 0 0 0 3px #4ecca3, 0 0 30px rgba(78, 204, 163, 0.25); }
  .card.wrong   { box-shadow: 0 0 0 3px #e74c3c, 0 0 30px rgba(231, 76, 60, 0.25); }

  .kana {
    font-size: 7rem;
    line-height: 1.1;
    margin-bottom: 0.2rem;
    font-family: "Hiragino Kaku Gothic Pro", "Yu Gothic", "Noto Sans JP", sans-serif;
    user-select: none;
    cursor: pointer;
  }

  .feedback {
    font-size: 0.95rem;
    color: #e74c3c;
    min-height: 1.4em;
    margin-bottom: 0.5rem;
    font-weight: 500;
  }

  /* Hint area */
  .hint-area {
    min-height: 3.2rem;
    margin-bottom: 0.7rem;
  }

  .hint-btn {
    padding: 0.35rem 1.2rem;
    border: 1px solid #3a3a5c;
    border-radius: 6px;
    background: transparent;
    color: #8888aa;
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.15s;
  }

  .hint-btn:hover { border-color: #6c63ff; color: #c0c0d8; }

  .hint-content {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 0.2rem;
  }

  .hint-content.visible { display: flex; }

  .hint-romaji {
    font-size: 1.4rem;
    font-weight: 700;
    color: #f0c040;
    letter-spacing: 0.05em;
  }

  .hint-mnemonic {
    font-size: 0.85rem;
    color: #a0a0c0;
    font-style: italic;
    max-width: 320px;
    line-height: 1.4;
  }

  .input-row {
    display: flex;
    justify-content: center;
  }

  #answer {
    width: 180px;
    padding: 0.6rem 1rem;
    font-size: 1.3rem;
    text-align: center;
    border: 2px solid #3a3a5c;
    border-radius: 8px;
    background: #0f1a30;
    color: #f0f0f0;
    outline: none;
    transition: border-color 0.15s;
    letter-spacing: 0.05em;
  }

  #answer:focus { border-color: #6c63ff; }

  .stats {
    display: flex;
    justify-content: center;
    gap: 2rem;
    margin-top: 1rem;
    font-size: 1rem;
    color: #8888aa;
  }

  .stats span { font-weight: 600; color: #c0c0d8; }

  .shortcut-hint {
    margin-top: 0.8rem;
    font-size: 0.75rem;
    color: #555577;
  }

  /* ====== STUDY VIEW ====== */
  .study-view {
    text-align: left;
  }

  .study-section {
    margin-bottom: 1.5rem;
  }

  .study-section h2 {
    font-size: 1rem;
    color: #8888aa;
    margin-bottom: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    border-bottom: 1px solid #2a2a4c;
    padding-bottom: 0.3rem;
  }

  .study-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
    gap: 0.5rem;
  }

  .study-card {
    background: #16213e;
    border-radius: 10px;
    padding: 0.6rem 0.4rem;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
    border: 1px solid transparent;
  }

  .study-card:hover { border-color: #6c63ff; transform: translateY(-1px); }

  .study-card .sc-kana {
    font-size: 2rem;
    font-family: "Hiragino Kaku Gothic Pro", "Yu Gothic", "Noto Sans JP", sans-serif;
  }

  .study-card .sc-romaji {
    font-size: 0.8rem;
    color: #f0c040;
    font-weight: 600;
    margin-top: 0.15rem;
  }

  .study-card .sc-mnemonic {
    font-size: 0.65rem;
    color: #7777aa;
    font-style: italic;
    margin-top: 0.15rem;
    line-height: 1.3;
    min-height: 2em;
  }

  /* Expanded study card detail */
  .study-detail {
    display: none;
    background: #16213e;
    border-radius: 14px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
    text-align: center;
    border: 2px solid #6c63ff;
  }

  .study-detail.visible { display: block; }

  .study-detail .sd-kana {
    font-size: 5rem;
    font-family: "Hiragino Kaku Gothic Pro", "Yu Gothic", "Noto Sans JP", sans-serif;
    line-height: 1.1;
  }

  .study-detail .sd-romaji {
    font-size: 1.6rem;
    color: #f0c040;
    font-weight: 700;
    margin: 0.3rem 0;
  }

  .study-detail .sd-mnemonic {
    font-size: 0.95rem;
    color: #a0a0c0;
    font-style: italic;
    line-height: 1.5;
    max-width: 360px;
    margin: 0 auto;
  }

  .study-detail .sd-close {
    margin-top: 0.8rem;
    padding: 0.3rem 1rem;
    border: 1px solid #3a3a5c;
    border-radius: 6px;
    background: transparent;
    color: #8888aa;
    cursor: pointer;
    font-size: 0.8rem;
  }

  .study-detail .sd-close:hover { border-color: #6c63ff; color: #d0d0e8; }

  /* ====== LESSON VIEW ====== */
  .lesson-header { margin-bottom: 1rem; }
  .lesson-kicker {
    font-size: 0.75rem;
    color: #4ecca3;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 0.2rem;
  }
  .lesson-title { font-size: 1.25rem; color: #f0f0f0; margin-bottom: 0.25rem; }
  .lesson-progress { font-size: 0.8rem; color: #8888aa; }
  .lesson-section-label {
    font-size: 0.75rem;
    color: #8888aa;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin: 1.1rem 0 0.5rem;
    text-align: left;
  }
  .lesson-word {
    display: flex;
    align-items: baseline;
    gap: 0.8rem;
    background: #16213e;
    border-radius: 10px;
    padding: 0.55rem 0.8rem;
    margin-bottom: 0.45rem;
    cursor: pointer;
    text-align: left;
    border: 1px solid transparent;
    transition: all 0.15s;
  }
  .lesson-word:hover { border-color: #6c63ff; }
  .lesson-word .lw-kana {
    font-size: 1.5rem;
    font-family: "Hiragino Kaku Gothic Pro", "Yu Gothic", "Noto Sans JP", sans-serif;
    min-width: 5.5rem;
  }
  .lesson-word .lw-romaji { font-size: 0.85rem; color: #f0c040; font-weight: 600; }
  .lesson-word .lw-meaning { font-size: 0.85rem; color: #a0a0c0; margin-left: auto; text-align: right; }
  .lesson-actions, .lesson-nav {
    display: flex;
    gap: 0.6rem;
    justify-content: center;
    margin-top: 1.1rem;
    flex-wrap: wrap;
  }
  .lesson-btn {
    padding: 0.5rem 1.1rem;
    border: 2px solid #3a3a5c;
    border-radius: 8px;
    background: transparent;
    color: #b0b0c8;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  .lesson-btn:hover { border-color: #6c63ff; color: #d0d0e8; }
  .lesson-btn.primary { background: #4ecca3; border-color: #4ecca3; color: #111; font-weight: 700; }
  .lesson-btn.primary:hover { background: #3fb98f; border-color: #3fb98f; color: #111; }
  .lesson-btn.secondary { opacity: 0.75; }
  .lesson-btn:disabled { opacity: 0.3; cursor: default; }
  .lesson-btn:disabled:hover { border-color: #3a3a5c; color: #b0b0c8; }

  /* Lesson-scoped drill banner */
  .lesson-drill-banner {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    background: #16213e;
    border: 1px solid #4ecca3;
    border-radius: 8px;
    padding: 0.35rem 0.7rem;
    margin-bottom: 0.7rem;
    font-size: 0.8rem;
    color: #4ecca3;
  }
  .lesson-drill-banner.hidden { display: none; }
  .lesson-drill-banner button {
    background: transparent;
    border: none;
    color: #8888aa;
    font-size: 0.85rem;
    cursor: pointer;
    padding: 0.1rem 0.35rem;
  }
  .lesson-drill-banner button:hover { color: #e0e0e0; }

  /* Cheatsheet: not-yet-learned kana */
  .ct-locked { opacity: 0.22; }

  /* ====== CHEATSHEET MODAL ====== */
  .cheatsheet-btn {
    position: fixed;
    bottom: 1.2rem;
    right: 1.2rem;
    padding: 0.5rem 1rem;
    border: 2px solid #3a3a5c;
    border-radius: 8px;
    background: #16213e;
    color: #b0b0c8;
    font-size: 0.85rem;
    cursor: pointer;
    z-index: 100;
    transition: all 0.15s;
  }

  .cheatsheet-btn:hover { border-color: #6c63ff; color: #d0d0e8; background: #1e2a4a; }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10, 10, 25, 0.92);
    z-index: 200;
    overflow-y: auto;
    padding: 2rem 1rem;
  }

  .modal-overlay.visible { display: block; }

  .modal {
    max-width: 700px;
    margin: 0 auto;
    background: #16213e;
    border-radius: 14px;
    padding: 1.5rem;
    position: relative;
  }

  .modal h2 {
    font-size: 1.2rem;
    color: #f0f0f0;
    margin-bottom: 1rem;
    text-align: center;
  }

  .modal .close-btn {
    position: absolute;
    top: 0.8rem;
    right: 1rem;
    background: none;
    border: none;
    color: #8888aa;
    font-size: 1.5rem;
    cursor: pointer;
    line-height: 1;
  }

  .modal .close-btn:hover { color: #e0e0e0; }

  .cheat-section-title {
    font-size: 0.85rem;
    color: #8888aa;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin: 1.2rem 0 0.4rem;
    border-bottom: 1px solid #2a2a4c;
    padding-bottom: 0.25rem;
  }

  .cheat-section-title:first-child { margin-top: 0; }

  .cheat-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }

  .cheat-table th {
    text-align: center;
    color: #8888aa;
    font-weight: 600;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 0.3rem 0.2rem;
    border-bottom: 1px solid #2a2a4c;
  }

  .cheat-table td {
    text-align: center;
    padding: 0.35rem 0.2rem;
    border-bottom: 1px solid #1a1a3c;
  }

  .cheat-table .ct-romaji { color: #f0c040; font-weight: 600; }
  .cheat-table .ct-hira, .cheat-table .ct-kata {
    font-family: "Hiragino Kaku Gothic Pro", "Yu Gothic", "Noto Sans JP", sans-serif;
    font-size: 1.1rem;
  }

  /* ====== MULTIPLE CHOICE ====== */
  .choices-row {
    display: none;
    gap: 0.6rem;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 0.75rem;
  }

  .choice-btn {
    padding: 0.75rem 1.4rem;
    font-size: 1.2rem;
    border: 2px solid #3a3a5c;
    border-radius: 10px;
    background: #16213e;
    color: #e0e0e0;
    cursor: pointer;
    transition: all 0.15s;
    min-width: 80px;
    letter-spacing: 0.05em;
  }

  .choice-btn:hover { border-color: #6c63ff; }
  .choice-btn.correct { background: #4ecca3; border-color: #4ecca3; color: #111; }
  .choice-btn.wrong   { background: #e74c3c; border-color: #e74c3c; color: #fff; }
  .choice-btn.reveal  { background: #4ecca3; border-color: #4ecca3; color: #111; }

  /* ====== MOBILE ====== */
  @media (max-width: 600px) {
    body {
      padding-top: 0;
      align-items: stretch;
      height: 100dvh;
      overflow: hidden;
    }

    .app {
      padding: 0.75rem 1rem 1rem;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    h1 { font-size: 1.2rem; margin-bottom: 0.5rem; }

    .modes { margin-bottom: 0.4rem; }
    .modes button, .view-toggle button { padding: 0.35rem 0.7rem; font-size: 0.8rem; }

    .includes { gap: 0.8rem; margin-bottom: 0.4rem; flex-wrap: wrap; }

    .view-toggle { margin-bottom: 0.75rem; }

    .drill-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .card {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 1rem;
      margin-bottom: 0.75rem;
      min-height: 0;
    }

    .kana { font-size: 6rem; }

    .hint-area { min-height: 2.8rem; margin-bottom: 0.5rem; }

    #answer { display: none; }
    .hint-area { display: none; }
    .choices-row { display: flex; }

    .kana { font-size: 5rem; }

    .stats { margin-top: 0.6rem; font-size: 0.9rem; }

    .shortcut-hint { display: none; }

    .cheatsheet-btn { bottom: 0.75rem; right: 0.75rem; }
  }
</style>
</head>
<body>
<div class="app">
  <h1>Kana Dojo</h1>

  <div class="modes">
    <button class="active" data-mode="hiragana">Hiragana</button>
    <button data-mode="katakana">Katakana</button>
    <button data-mode="both">Both</button>
  </div>

  <div class="includes">
    <label><input type="checkbox" id="incDakuten"> Dakuten / Handakuten</label>
    <label><input type="checkbox" id="incYoon"> Combinations (Yōon)</label>
    <label><input type="checkbox" id="incAudio" checked> Audio</label>
  </div>

  <div class="view-toggle">
    <button class="active" data-view="drill">Drill</button>
    <button data-view="study">Study</button>
    <button data-view="lesson">Lesson</button>
  </div>

  <!-- DRILL VIEW -->
  <div class="drill-view" id="drillView">
    <div id="lessonDrillBanner" class="lesson-drill-banner hidden">
      <span id="lessonDrillLabel">Lesson drill</span>
      <button id="lessonDrillExit" title="Back to full drill">✕</button>
    </div>
    <div class="card" id="card">
      <div class="kana" id="kana"></div>
      <div class="feedback" id="feedback"></div>
      <div class="hint-area" id="hintArea">
        <button class="hint-btn" id="hintBtn">Show Hint (Space)</button>
        <div class="hint-content" id="hintContent">
          <div class="hint-romaji" id="hintRomaji"></div>
          <div class="hint-mnemonic" id="hintMnemonic"></div>
        </div>
      </div>
      <div class="input-row">
        <input id="answer" type="text" autocomplete="off" autofocus placeholder="romaji">
      </div>
      <div class="choices-row" id="choicesRow"></div>
    </div>

    <div class="stats">
      <div>Score: <span id="score">0 / 0</span></div>
      <div>Streak: <span id="streak">0</span></div>
    </div>
    <div class="shortcut-hint">Space = hint &middot; Enter = submit</div>
  </div>

  <!-- STUDY VIEW -->
  <div class="study-view hidden" id="studyView">
    <div class="study-detail" id="studyDetail">
      <div class="sd-kana" id="sdKana"></div>
      <div class="sd-romaji" id="sdRomaji"></div>
      <div class="sd-mnemonic" id="sdMnemonic"></div>
      <button class="sd-close" id="sdClose">Close</button>
    </div>
    <div id="studyContent"></div>
  </div>

  <!-- LESSON VIEW -->
  <div class="lesson-view hidden" id="lessonView">
    <div class="lesson-header">
      <div class="lesson-kicker" id="lessonKicker"></div>
      <h2 class="lesson-title" id="lessonTitle"></h2>
      <div class="lesson-progress" id="lessonProgress"></div>
    </div>
    <div class="lesson-section-label">New characters</div>
    <div class="study-grid" id="lessonCharGrid"></div>
    <div class="lesson-section-label">Practice words</div>
    <div id="lessonWordList"></div>
    <div class="lesson-actions">
      <button class="lesson-btn" id="lessonDrillBtn">Drill this lesson</button>
      <button class="lesson-btn" id="lessonReviewBtn">Review all learned</button>
    </div>
    <div class="lesson-nav">
      <button class="lesson-btn secondary" id="lessonPrevBtn">← Prev</button>
      <button class="lesson-btn primary" id="lessonNextBtn">Mark complete &amp; next →</button>
    </div>
  </div>
</div>

<button class="cheatsheet-btn" id="cheatsheetBtn">Cheatsheet</button>

<div class="modal-overlay" id="cheatModal">
  <div class="modal">
    <button class="close-btn" id="cheatClose">&times;</button>
    <h2>Kana Cheatsheet</h2>
    <div id="cheatBody"></div>
  </div>
</div>

<script>
// ============================================================
// MNEMONICS — visual shape-based memory aids
// ============================================================
const MNEMONIC = {
  // --- Hiragana base ---
  'あ': 'Looks like an Antelope running — "Ah!"',
  'い': 'Two eels standing side by side — "ee"',
  'う': 'A mouth from the side saying "Oo"',
  'え': 'An exotic bird with a fancy tail',
  'お': 'A golfer swinging — "Oh, nice shot!"',
  'か': 'A blade that can KA-t things',
  'き': 'A skeleton KEY hanging on a hook',
  'く': 'A CUCKoo bird\'s open beak',
  'け': 'A KEg on its side with a tap',
  'こ': 'Two worms — "KOme here, worms!"',
  'さ': 'A man sitting cross-legged in a SAuna',
  'し': 'A fiSHing hook dangling in water',
  'す': 'A person on a SWing — "su-wing!"',
  'せ': 'A hand reaching to SAY something',
  'そ': 'A zigzag stitch — "SEW a zigzag"',
  'た': 'The letters "t" and "a" mashed together',
  'ち': 'A CHEerleader doing a high kick',
  'つ': 'A TSUnami wave cresting',
  'て': 'A dog wagging its TAIL — "teh"',
  'と': 'A TOrnado touching down',
  'な': 'A KNOt tied in a rope — "nah"',
  'に': 'A person on their kNEEs',
  'ぬ': 'Chopsticks picking up NOOdles',
  'ね': 'A cat curled up (NEko = cat)',
  'の': 'A "NO entry" swirl sign',
  'は': 'A person laughing "HA HA!" with arms up',
  'ひ': 'A smiling face saying "HEE hee!"',
  'ふ': 'Mt. FUji with a trail of smoke',
  'へ': 'A hill — "HEY, nice hill!"',
  'ほ': 'A house for Santa — "HO ho ho!"',
  'ま': 'A MAma with a baby on her back',
  'み': 'Lucky number 3 with a tail (MI = three)',
  'む': 'A cow\'s face — "MOO"',
  'め': 'An eye spinning around (ME = eye)',
  'も': 'A fishhook catching MOre fish',
  'や': 'A YAk\'s head with horns',
  'ゆ': 'A fish swimming — "what a Unique fish!"',
  'よ': 'A person playing with a YO-yo',
  'ら': 'A person RApidly running',
  'り': 'Two REEds growing by a RIver',
  'る': 'A kangaroo\'s tail makes a LOOP (RU)',
  'れ': 'A person REaching out their hand',
  'ろ': 'A ROad curving into the distance',
  'わ': 'A swan on WAter',
  'を': 'Like わ doing a trick — "WO-ah!"',
  'ん': 'The eNd! Last character — looks like "n"',

  // --- Katakana base ---
  'ア': 'An AXe chopping — "Ah!"',
  'イ': 'An Eagle\'s beak in profile',
  'ウ': 'A whale spouting — "OO!"',
  'エ': 'An Elevator going up and down',

// For dakuten/handakuten, generate systematic hints
function getDakutenHint(kana, romaji) {
  // Find if it's a dakuten (゛) or handakuten (゜) variant
  if (romaji.startsWith('g'))  return `Add ゛ to the "k" row → voiced "g" sound: ${romaji}`;
  if (romaji.startsWith('z') || romaji === 'ji' || romaji === 'zu')
    return `Add ゛ to the "s" row → voiced "z" sound: ${romaji}`;
  if (romaji.startsWith('d') || romaji === 'di' || romaji === 'du')
    return `Add ゛ to the "t" row → voiced "d" sound: ${romaji}`;
  if (romaji.startsWith('b'))  return `Add ゛ to the "h" row → voiced "b" sound: ${romaji}`;
  if (romaji.startsWith('p'))  return `Add ゜ to the "h" row → popping "p" sound: ${romaji}`;
  return `Modified base character → ${romaji}`;
}

// For yoon combinations, generate systematic hints
function getYoonHint(kana, romaji) {
  return `Combo: big char + small や/ゆ/よ → blend the sounds into "${romaji}"`;
}

function getMnemonic(kana, romaji) {
  if (MNEMONIC[kana]) return MNEMONIC[kana];
  // Check if it's a multi-char (yoon)
  if (kana.length > 1) return getYoonHint(kana, romaji);
  // Dakuten / handakuten
  return getDakutenHint(kana, romaji);
}

function recordResult(kana, wasCorrect) {
  kanaScores[kana] = (kanaScores[kana] || 0) + (wasCorrect ? 1 : -1);
  localStorage.setItem('kanaScores', JSON.stringify(kanaScores));
}

function weightFor(kana) {
  const s = kanaScores[kana] || 0;
  return Math.max(1, 6 - s);
}

// ============================================================
// DRILL LOGIC
// ============================================================
function getPool() {
  if (drillPoolOverride) return drillPoolOverride;
  const incDakuten = document.getElementById('incDakuten').checked;
  const incYoon    = document.getElementById('incYoon').checked;

  let pool = {};
  if (mode === 'hiragana' || mode === 'both') {
    Object.assign(pool, HIRAGANA_BASE);
    if (incDakuten) Object.assign(pool, HIRAGANA_DAKUTEN);
    if (incYoon)    Object.assign(pool, HIRAGANA_YOON);
  }
  if (mode === 'katakana' || mode === 'both') {
    Object.assign(pool, KATAKANA_BASE);
    if (incDakuten) Object.assign(pool, KATAKANA_DAKUTEN);
    if (incYoon)    Object.assign(pool, KATAKANA_YOON);
  }
  return pool;
}

function pickRandom() {
  const pool = getPool();
  const keys = Object.keys(pool).filter(k => k !== currentKana || Object.keys(pool).length === 1);
  const weights = keys.map(k => weightFor(k));
  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  let next = keys[keys.length - 1];
  for (let i = 0; i < keys.length; i++) {
    r -= weights[i];
    if (r <= 0) { next = keys[i]; break; }
  }
  currentKana = next;
  currentAnswer = pool[next];
}

function isMobile() {
  return window.matchMedia('(max-width: 600px)').matches;
}

function buildChoices() {
  const choicesRow = document.getElementById('choicesRow');
  while (choicesRow.firstChild) choicesRow.removeChild(choicesRow.firstChild);
  const pool = getPool();
  const allAnswers = Object.values(pool).filter(a => a !== currentAnswer);
  const wrong = allAnswers.sort(() => Math.random() - 0.5).slice(0, 2);
  const choices = [currentAnswer, ...wrong].sort(() => Math.random() - 0.5);

  choices.forEach(choice => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = choice;
    btn.addEventListener('click', () => handleChoice(choice, btn, choicesRow));
    choicesRow.appendChild(btn);
  });
}

function handleChoice(choice, btn, choicesRow) {
  if (locked) return;
  total++;
  if (choice === currentAnswer) {
    btn.classList.add('correct');
    correct++;
    streak++;
    recordResult(currentKana, true);
    speakKana(currentKana);
    updateStats();
    locked = true;
    setTimeout(() => { locked = false; showCard(); }, 600);
  } else {
    btn.classList.add('wrong');
    streak = 0;
    recordResult(currentKana, false);
    speakKana(currentKana);
    choicesRow.querySelectorAll('.choice-btn').forEach(b => {
      if (b.textContent === currentAnswer) b.classList.add('reveal');
    });
    updateStats();
    locked = true;
    setTimeout(() => { locked = false; showCard(); }, 1500);
  }
}

function showCard() {
  pickRandom();
  kanaEl.textContent = currentKana;
  feedbackEl.textContent = '';
  hintShown = false;
  hintUsedThisRound = false;
  if (isMobile()) {
    buildChoices();
  } else {
    inputEl.value = '';
    hintBtn.style.display = '';
    hintContent.classList.remove('visible');
    inputEl.focus();
  }
}

function speakKana(kana) {
  if (!document.getElementById('incAudio').checked) return;
  const utterance = new SpeechSynthesisUtterance(kana);
  utterance.lang = 'ja-JP';
  speechSynthesis.speak(utterance);
}

function revealHint() {
  if (hintShown) return;
  hintShown = true;
  hintUsedThisRound = true;
  hintBtn.style.display = 'none';
  hintRomaji.textContent = currentAnswer;
  hintMnemonic.textContent = getMnemonic(currentKana, currentAnswer);
  hintContent.classList.add('visible');
  speakKana(currentKana);
  inputEl.focus();
}

function flash(type) {
  cardEl.classList.remove('correct', 'wrong');
  void cardEl.offsetWidth;
  cardEl.classList.add(type);
  setTimeout(() => cardEl.classList.remove(type), 600);
}

function updateStats() {
  scoreEl.textContent = `${correct} / ${total}`;
  streakEl.textContent = streak;
}

function submit() {
  if (locked) return;
  const guess = inputEl.value.trim().toLowerCase();
  if (!guess) return;

  total++;

  if (guess === currentAnswer) {
    correct++;
    streak++;
    recordResult(currentKana, true);
    flash('correct');
    speakKana(currentKana);
    updateStats();
    showCard();
  } else {
    streak = 0;
    recordResult(currentKana, false);
    flash('wrong');
    speakKana(currentKana);
    feedbackEl.textContent = `${currentKana} = ${currentAnswer}`;
    // Also show the mnemonic on wrong answer so they learn
    hintBtn.style.display = 'none';
    hintRomaji.textContent = currentAnswer;
    hintMnemonic.textContent = getMnemonic(currentKana, currentAnswer);
    hintContent.classList.add('visible');
    updateStats();
    locked = true;
    setTimeout(() => { locked = false; showCard(); }, 2000);
  }
}

function buildStudyView() {
  const incDakuten = document.getElementById('incDakuten').checked;
  const incYoon    = document.getElementById('incYoon').checked;

  function makeSections(prefix, base, dakuten, yoon) {
    const s = [[`${prefix} — Base (Gojūon)`, base]];
    if (incDakuten) s.push([`${prefix} — Dakuten & Handakuten`, dakuten]);
    if (incYoon)    s.push([`${prefix} — Combinations (Yōon)`, yoon]);
    return s;
  }

  let sections;
  if (mode === 'hiragana') {
    sections = makeSections('Hiragana', HIRAGANA_BASE, HIRAGANA_DAKUTEN, HIRAGANA_YOON);
  } else if (mode === 'katakana') {
    sections = makeSections('Katakana', KATAKANA_BASE, KATAKANA_DAKUTEN, KATAKANA_YOON);
  } else {
    sections = [
      ...makeSections('Hiragana', HIRAGANA_BASE, HIRAGANA_DAKUTEN, HIRAGANA_YOON),
      ...makeSections('Katakana', KATAKANA_BASE, KATAKANA_DAKUTEN, KATAKANA_YOON),
    ];
  }

  studyContent.innerHTML = '';
  studyDetail.classList.remove('visible');

  for (const [title, data] of sections) {
    const sec = document.createElement('div');
    sec.className = 'study-section';

    const h2 = document.createElement('h2');
    h2.textContent = title;
    sec.appendChild(h2);

    const grid = document.createElement('div');
    grid.className = 'study-grid';

    for (const [kana, romaji] of Object.entries(data)) {
      const card = document.createElement('div');
      card.className = 'study-card';
      card.innerHTML = `
        <div class="sc-kana">${kana}</div>
        <div class="sc-romaji">${romaji}</div>
        <div class="sc-mnemonic">${getMnemonic(kana, romaji)}</div>
      `;
      card.addEventListener('click', () => openStudyDetail(kana, romaji));
      grid.appendChild(card);
    }

    sec.appendChild(grid);
    studyContent.appendChild(sec);
  }
}

function openStudyDetail(kana, romaji) {
  document.getElementById('sdKana').textContent = kana;
  document.getElementById('sdRomaji').textContent = romaji;
  document.getElementById('sdMnemonic').textContent = getMnemonic(kana, romaji);
  studyDetail.classList.add('visible');
  studyDetail.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

document.getElementById('sdClose').addEventListener('click', () => {
  studyDetail.classList.remove('visible');
});

// ============================================================
// LESSON MODE
// ============================================================
const KANA_MAPS = [HIRAGANA_BASE, HIRAGANA_DAKUTEN, HIRAGANA_YOON,
                   KATAKANA_BASE, KATAKANA_DAKUTEN, KATAKANA_YOON];

function romajiFor(kana) {
  for (const m of KANA_MAPS) if (m[kana]) return m[kana];
  return '';
}

// Every kana introduced in lessons 0..lessonIndex.
function learnedSet() {
  const s = new Set();
  for (let i = 0; i <= lessonIndex; i++) {
    for (const k of LESSONS[i].chars) s.add(k);
  }
  return s;
}

function saveLessonIndex() {
  localStorage.setItem('kanaDojoLesson', String(lessonIndex));
}

function buildLessonView() {
  const lesson = LESSONS[viewedLesson];
  lessonKicker.textContent = `Lesson ${lesson.n} of ${LESSONS.length}`;
  lessonTitle.textContent = lesson.title;
  if (lessonIndex >= LESSONS.length - 1) {
    lessonProgress.textContent = 'Curriculum complete — review mode';
  } else {
    const remaining = LESSONS.length - 1 - lessonIndex;
    lessonProgress.textContent = `${remaining} lesson${remaining === 1 ? '' : 's'} to go after this one`;
  }

  lessonCharGrid.innerHTML = '';
  for (const kana of lesson.chars) {
    const romaji = romajiFor(kana);
    const card = document.createElement('div');
    card.className = 'study-card';
    card.innerHTML = `
      <div class="sc-kana">${kana}</div>
      <div class="sc-romaji">${romaji}</div>
      <div class="sc-mnemonic">${getMnemonic(kana, romaji)}</div>
    `;
    card.addEventListener('click', () => speakKana(kana));
    lessonCharGrid.appendChild(card);
  }

  lessonWordList.innerHTML = '';
  for (const w of lesson.words) {
    const row = document.createElement('div');
    row.className = 'lesson-word';
    row.innerHTML = `
      <div class="lw-kana">${w.k}</div>
      <div class="lw-romaji">${w.r}</div>
      <div class="lw-meaning">${w.m}</div>
    `;
    row.addEventListener('click', () => speakKana(w.k));
    lessonWordList.appendChild(row);
  }

  lessonPrevBtn.disabled = viewedLesson === 0;
  const done = viewedLesson >= LESSONS.length - 1;
  lessonNextBtn.disabled = done;
  lessonNextBtn.textContent = done ? 'Curriculum complete' : 'Mark complete & next →';
}

function setView(next) {
  document.querySelector('.view-toggle .active').classList.remove('active');
  document.querySelector(`.view-toggle button[data-view="${next}"]`).classList.add('active');
  view = next;
  drillView.classList.toggle('hidden', view !== 'drill');
  studyView.classList.toggle('hidden', view !== 'study');
  lessonView.classList.toggle('hidden', view !== 'lesson');
  if (view === 'drill') inputEl.focus();
  else if (view === 'study') buildStudyView();
  else if (view === 'lesson') buildLessonView();
}

function startLessonDrill(chars, label) {
  const pool = {};
  for (const kana of chars) {
    const r = romajiFor(kana);
    if (r) pool[kana] = r;
  }
  drillPoolOverride = pool;
  lessonDrillLabel.textContent = label;
  lessonDrillBanner.classList.remove('hidden');
  correct = 0; total = 0; streak = 0;
  updateStats();
  setView('drill');
  showCard();
}

function clearLessonDrill() {
  drillPoolOverride = null;
  lessonDrillBanner.classList.add('hidden');
}

lessonPrevBtn.addEventListener('click', () => {
  if (viewedLesson > 0) { viewedLesson--; buildLessonView(); }
});

lessonNextBtn.addEventListener('click', () => {
  lessonIndex = Math.min(Math.max(lessonIndex, viewedLesson + 1), LESSONS.length - 1);
  viewedLesson = lessonIndex;
  saveLessonIndex();
  buildLessonView();
});

lessonDrillBtn.addEventListener('click', () => {
  const lesson = LESSONS[viewedLesson];
  startLessonDrill(lesson.chars, `Lesson ${lesson.n} drill — ${lesson.title}`);
});

lessonReviewBtn.addEventListener('click', () => {
  startLessonDrill([...learnedSet()], 'Review — all learned kana');
});

document.getElementById('lessonDrillExit').addEventListener('click', () => {
  clearLessonDrill();
  showCard();
});

// ============================================================
// EVENT HANDLERS
// ============================================================

// Hint button click
hintBtn.addEventListener('click', revealHint);

// Tap/click the kana character to reveal hint (mobile-friendly)
kanaEl.addEventListener('click', revealHint);

// Keyboard
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    submit();
  } else if (e.key === ' ' && inputEl.value === '') {
    e.preventDefault();
    revealHint();
  }
});

// Mode toggle
document.querySelectorAll('.modes button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelector('.modes .active').classList.remove('active');
    btn.classList.add('active');
    mode = btn.dataset.mode;
    correct = 0; total = 0; streak = 0;
    clearLessonDrill();
    updateStats();
    showCard();
    if (view === 'study') buildStudyView();
  });
});

// Include checkboxes
document.querySelectorAll('.includes input').forEach(cb => {
  cb.addEventListener('change', () => {
    correct = 0; total = 0; streak = 0;
    clearLessonDrill();
    updateStats();
    showCard();
    if (view === 'study') buildStudyView();
  });
});

// View toggle (Drill / Study / Lesson)
document.querySelectorAll('.view-toggle button').forEach(btn => {
  btn.addEventListener('click', () => setView(btn.dataset.view));
});

// ============================================================
// CHEATSHEET
// ============================================================
const cheatModal = document.getElementById('cheatModal');
const cheatBody  = document.getElementById('cheatBody');

function buildCheatsheet() {
  // Pair up hiragana and katakana by romaji
  const sections = [
    ['Base (Gojūon)', HIRAGANA_BASE, KATAKANA_BASE],
    ['Dakuten & Handakuten', HIRAGANA_DAKUTEN, KATAKANA_DAKUTEN],
    ['Combinations (Yōon)', HIRAGANA_YOON, KATAKANA_YOON],
  ];

  // Dim kana not yet introduced by the lesson curriculum.
  const learned = learnedSet();

  let html = '';
  for (const [title, hiraSet, kataSet] of sections) {
    html += `<div class="cheat-section-title">${title}</div>`;
    html += `<table class="cheat-table"><tr><th>Romaji</th><th>Hiragana</th><th>Katakana</th></tr>`;

    // Build a romaji → {hira, kata} map preserving hiragana key order
    const rows = [];
    const seen = new Set();
    for (const [kana, romaji] of Object.entries(hiraSet)) {
      if (!seen.has(romaji)) {
        seen.add(romaji);
        rows.push({ romaji, hira: kana });
      }
    }
    for (const [kana, romaji] of Object.entries(kataSet)) {
      const row = rows.find(r => r.romaji === romaji);
      if (row) row.kata = kana;
    }

    for (const r of rows) {
      const hiraCls = (r.hira && !learned.has(r.hira)) ? 'ct-hira ct-locked' : 'ct-hira';
      const kataCls = (r.kata && !learned.has(r.kata)) ? 'ct-kata ct-locked' : 'ct-kata';
      html += `<tr>
        <td class="ct-romaji">${r.romaji}</td>
        <td class="${hiraCls}">${r.hira || ''}</td>
        <td class="${kataCls}">${r.kata || ''}</td>
      </tr>`;
    }
    html += `</table>`;
  }
  cheatBody.innerHTML = html;
}

function openCheatsheet() {
  buildCheatsheet();
  cheatModal.classList.add('visible');
}

function closeCheatsheet() {
  cheatModal.classList.remove('visible');
  if (view === 'drill') inputEl.focus();
}

document.getElementById('cheatsheetBtn').addEventListener('click', openCheatsheet);
document.getElementById('cheatClose').addEventListener('click', closeCheatsheet);
cheatModal.addEventListener('click', e => { if (e.target === cheatModal) closeCheatsheet(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && cheatModal.classList.contains('visible')) closeCheatsheet();
});

// Start
showCard();
</script>
